<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2942" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <!-- Background with slight rounding for any-purpose icon -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />

  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="12 6" opacity="0.6" />
  <circle cx="256" cy="256" r="200" fill="#FFFFFF" stroke="#93278F" stroke-width="12" />

  <!-- Top Halo / Motif -->
  <circle cx="256" cy="140" r="42" fill="#FEF3C7" />
  <!-- Book Icon on Top -->
  <path d="M 256 160 Q 220 148 180 160 L 190 135 Q 225 125 256 140 Z" fill="#E0F2FE" stroke="#0284C7" stroke-width="3" />
  <path d="M 256 160 Q 292 148 332 160 L 322 135 Q 287 125 256 140 Z" fill="#E0F2FE" stroke="#0284C7" stroke-width="3" />
  <circle cx="256" cy="120" r="14" fill="#D97706" />

  <!-- Central NVEA Wordmark -->
  <text x="180" y="248" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="94" fill="#F27A24" text-anchor="middle">N</text>
  <text x="296" y="248" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="94" fill="#93278F" text-anchor="middle">VEA</text>

  <!-- Horizontal Divider Bar -->
  <rect x="136" y="262" width="240" height="12" rx="6" fill="#008FD5" />

  <!-- Hindi Branding 'नव्या' -->
  <text x="256" y="340" font-family="'Noto Sans Devanagari', Arial, sans-serif" font-weight="800" font-size="76" fill="#008FD5" text-anchor="middle">नव्या</text>

  <!-- Bottom Tagline / Star Emblem -->
  <text x="256" y="390" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="20" fill="#0F2942" letter-spacing="2" text-anchor="middle">ADMISSION PORTAL</text>
  <circle cx="160" cy="384" r="4" fill="#D97706" />
  <circle cx="352" cy="384" r="4" fill="#D97706" />
</svg>
